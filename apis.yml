name: reTravel.io
description: reTravel.io is a travel retention marketing platform that uses data science
  and machine learning to help travel companies, TMCs, and corporates retain customers,
  increase attachment rates, and grow revenue from their existing clients. Founded in
  2020 by Revital Kristal and Nir Gurevich in Tel Aviv, the platform extracts booking
  information via predefined plugins and contextually engages travelers across multiple
  channels with personalized, policy-compliant products. It operates on a performance-based
  commercial model tied to the uplift it generates and is backed by Techstars. reTravel.io
  exposes no public developer API, SDK, or documentation surface at this time.
